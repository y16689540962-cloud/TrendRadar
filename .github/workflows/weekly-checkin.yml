name: Weekly Check In

# 自动签到：每 6 天运行一次，删除历史 workflow runs 重置 7 天试用期计时器，
# 保证 "Get Hot News" 永不停摆。也可以随时在 Actions 页面手动 Run workflow。

on:
  schedule:
    # UTC 时间，每周三 01:23 UTC ≈ 北京时间周三 09:23
    - cron: "23 1 * * 3"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete old workflow runs (reset 7-day trial timer)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"
